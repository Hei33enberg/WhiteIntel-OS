# Smithery listing + local stdio run config for the WhiteIntel MCP server.
# https://smithery.ai indexes/deploys MCP servers from a connected repo.
#
# NOTE ON THE INSTALL SOURCE: the command below installs from GitHub
# (github:Hei33enberg/WhiteIntel-OS), not from npm. This is deliberate — it always
# delivers the current server (21 tools); the npm package can lag. Once npm is
# republished to the current version, `@whiteintel/mcp-server` is an equivalent source.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      WHITEINTEL_API_KEY:
        type: string
        title: WhiteIntel API key (optional)
        description: >-
          Optional wi_ API key (whiteintel.dev -> Settings -> API keys). Lifts the
          anonymous free-tier limits to your plan. Omit to use the free tier.
    required: []
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "github:Hei33enberg/WhiteIntel-OS"],
      env: config.WHITEINTEL_API_KEY
        ? { WHITEINTEL_API_KEY: config.WHITEINTEL_API_KEY }
        : {}
    })
